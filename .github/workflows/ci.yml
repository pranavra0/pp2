name: Linux checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt
      - run: rustup override set 1.94.1
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo test --locked --all-targets
      - run: cargo build --release --locked --bin pp2
